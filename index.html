<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Battle Merge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing:border-box; font-family:system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  body {
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#0f172a,#020617 80%);
    color:#e5e7eb;
  }
  .shell {
    background:rgba(15,23,42,0.95);
    padding:16px;
    width:420px;
    max-width:95vw;
    border-radius:16px;
    border:1px solid rgba(56,189,248,0.2);
    box-shadow:0 22px 45px rgba(0,0,0,0.8);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  /* BATTLE ARENA */
  .battle-arena {
    background: linear-gradient(to bottom, #1e293b, #0f172a);
    border-radius: 12px;
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.3s;
  }
  
  .battle-arena.boss-mode {
    box-shadow: inset 0 0 40px rgba(220, 38, 38, 0.3);
    border: 1px solid #ef4444;
  }
  
  .stage-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 4px;
    height: 28px;
  }

  /* AUTO BUTTON */
  .btn-auto {
    background: #334155;
    color: #94a3b8;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #475569;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    display: none; /* Hidden by default */
  }
  .btn-auto.active {
    background: #10b981;
    color: #fff;
    border-color: #059669;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .btn-auto:hover { filter: brightness(1.2); }

  .combat-zone {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-grow: 1;
    position: relative;
  }

  .fighter {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 45%;
    position: relative;
  }

  .fighter-visual {
    font-size: 3rem;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
    transition: transform 0.1s;
    margin-bottom: 8px;
    position: relative;
  }

  /* Animations */
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .enemy-anim { animation: float 3s ease-in-out infinite; }
  .player-anim { animation: float 4s ease-in-out infinite reverse; }
  
  /* Hit Effects */
  .hit-flash { animation: flashRed 0.2s ease-out; }
  @keyframes flashRed { 
    0% { filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); transform: scale(0.9); } 
    100% { filter: none; transform: scale(1); }
  }
  
  .attack-lunge-right { animation: lungeRight 0.2s ease-out; }
  @keyframes lungeRight { 0% { transform: translateX(0); } 50% { transform: translateX(20px); } 100% { transform: translateX(0); } }

  .attack-lunge-left { animation: lungeLeft 0.2s ease-out; }
  @keyframes lungeLeft { 0% { transform: translateX(0); } 50% { transform: translateX(-20px); } 100% { transform: translateX(0); } }

  .dead { transform: scale(0) rotate(180deg); opacity: 0; transition: all 0.5s; }
  
  .vs-badge {
    font-weight: 900;
    color: #475569;
    font-size: 1.2rem;
    font-style: italic;
  }

  /* HP BARS */
  .hp-bar {
    width: 100%;
    height: 14px;
    background: #334155;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); /* Snappy transition */
  }
  .hp-player { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .hp-enemy { background: linear-gradient(90deg, #ef4444, #f87171); }
  .hp-boss { background: linear-gradient(90deg, #b91c1c, #f87171); }
  
  .hp-text {
    font-size: 0.65rem;
    margin-top: 4px;
    color: #cbd5e1;
    font-weight: bold;
  }

  /* OVERLAY */
  .battle-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,23,42,0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    border-radius: 12px;
  }
  .overlay-title { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
  .overlay-sub { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; text-align: center; max-width: 80%; }
  
  .btn-start {
    background: linear-gradient(to bottom, #ef4444, #b91c1c);
    border: 1px solid #f87171;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 99px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    text-transform: uppercase;
    animation: pulseBtn 2s infinite;
  }
  .btn-start:hover { transform: scale(1.05); }
  @keyframes pulseBtn {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  /* STATS ROW */
  .stats-row {
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    background:#1e293b;
    padding:8px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.1);
  }
  .stat-box { text-align:center; }
  .label { font-size:0.65rem; color:#94a3b8; text-transform:uppercase; margin-bottom: 2px; }
  .value { font-size:1rem; font-weight:bold; color:#f0f9ff; }
  .value.dps { color:#facc15; }
  .value.hp { color:#60a5fa; }
  .value.coins { color:#4ade80; }

  /* GRID */
  .grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    background: rgba(0,0,0,0.2);
    padding: 6px;
    border-radius: 12px;
  }
  .cell {
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    background:#0f172a;
    border:1px solid rgba(56,189,248,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all 0.1s;
  }
  .cell.selected {
    box-shadow:0 0 0 2px #facc15, 0 0 10px rgba(250,204,21,0.5);
    background:#1e293b;
    z-index: 2;
  }
  
  /* ORBS */
  .orb {
    width:80%;
    height:80%;
    border-radius:50%;
    object-fit: cover;
    box-shadow:0 0 8px rgba(255,255,255,0.2);
    display:block;
    transition: transform 0.1s;
  }
  .orb.attacking { animation: recoil 0.2s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes recoil { 
    0% { transform: scale(1); } 
    20% { transform: scale(1.3) translateY(-10px); } 
    100% { transform: scale(1); } 
  }
  
  .orb-fallback {
    width:70%;
    height:70%;
    border-radius:50%;
    box-shadow:0 0 10px currentColor;
  }

  .lvl1 { background:#38bdf8; color:#38bdf8; }
  .lvl2 { background:#4ade80; color:#4ade80; }
  .lvl3 { background:#facc15; color:#facc15; }
  .lvl4 { background:#f472b6; color:#f472b6; }
  .lvl5 { background:#a78bfa; color:#a78bfa; }
  .lvl6 { background:#fb923c; color:#fb923c; }
  .lvl7 { background:#6366f1; color:#6366f1; }
  .lvl8 { background:#ec4899; color:#ec4899; }
  .lvl9 { background:#dc2626; color:#dc2626; box-shadow: 0 0 15px #ef4444; border: 2px solid #fff; }

  .lvl-badge {
    position:absolute;
    bottom:1px;
    right:3px;
    font-size:0.6rem;
    color:#fff;
    font-weight:bold;
    text-shadow:0 1px 2px #000;
    pointer-events:none;
  }

  /* MARKET */
  .panel-title {
    font-size:0.75rem;
    text-transform:uppercase;
    color:#64748b;
    margin-left: 4px;
    margin-bottom: -4px;
    margin-top: 4px;
  }
  .actions-grid {
    display:grid;
    grid-template-columns:1fr; 
    gap:6px;
  }
  
  button.btn {
    background:linear-gradient(to bottom, #334155, #1e293b);
    border:1px solid rgba(255,255,255,0.1);
    color:#e2e8f0;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:all 0.1s;
    text-align:left;
  }
  button.btn:active { transform:translateY(2px); }
  button.btn:disabled { opacity:0.5; cursor:not-allowed; filter:grayscale(1); }
  
  .btn-buy-1 { border-left:4px solid #38bdf8; }
  .btn-buy-2 { border-left:4px solid #4ade80; }
  .btn-buy-3 { border-left:4px solid #facc15; }

  .btn-left { display:flex; flex-direction:column; }
  .btn-main-text { font-size:0.85rem; font-weight:bold; }
  .btn-sub-text { font-size:0.65rem; color:#94a3b8; }
  .btn-cost { font-weight:bold; color:#e2e8f0; font-size:0.9rem; }
  
  /* DAMAGE NUMBER POPUP */
  .dmg-num {
    position: absolute;
    font-weight: 900;
    font-size: 1.4rem;
    pointer-events: none;
    animation: popUp 0.6s ease-out forwards;
    text-shadow: 2px 2px 0 #000;
    z-index: 100;
  }
  @keyframes popUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -20px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }
  
  /* Boss Flash Animation */
  @keyframes bossWarning {
    0% { background: rgba(220, 38, 38, 0); }
    50% { background: rgba(220, 38, 38, 0.4); }
    100% { background: rgba(220, 38, 38, 0); }
  }
  .boss-flash {
    position: fixed; top:0; left:0; right:0; bottom:0;
    pointer-events: none;
    z-index: 999;
    animation: bossWarning 0.5s ease-in-out 3;
  }
</style>
</head>
<body>

<div class="shell">
  
  <!-- BATTLE AREA -->
  <div class="battle-arena" id="arena">
    <div class="stage-header">
      <div id="stageInfo">Stage <span id="stageNum">1</span> - Wave <span id="waveNum">1</span>/5</div>
      <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">AUTO: OFF</button>
    </div>
    
    <div class="combat-zone">
      <!-- Player -->
      <div class="fighter">
        <div class="fighter-visual player-anim" id="playerVisual">🤖</div>
        <div class="hp-bar"><div class="hp-fill hp-player" id="hpBarPlayer"></div></div>
        <div class="hp-text"><span id="hpCurPlayer">100</span>/<span id="hpMaxPlayer">100</span> HP</div>
      </div>

      <div class="vs-badge" id="vsBadge">VS</div>

      <!-- Enemy -->
      <div class="fighter">
        <div class="fighter-visual enemy-anim" id="enemyVisual" onclick="clickDamage(event)">👾</div>
        <div class="hp-bar"><div class="hp-fill hp-enemy" id="hpBarEnemy"></div></div>
        <div class="hp-text"><span id="hpCurEnemy">50</span>/<span id="hpMaxEnemy">50</span> HP</div>
      </div>
    </div>

    <!-- OVERLAY (Start / Game Over) -->
    <div class="battle-overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">READY?</div>
      <div class="overlay-sub" id="overlaySub">Prepare your units.</div>
      <button class="btn-start" onclick="startWave()">⚔️ Fight Wave</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="label">Coins</div>
      <div class="value coins" id="coinsDisplay">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Army DMG</div>
      <div class="value dps" id="dpsDisplay">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Army HP</div>
      <div class="value hp" id="hpDisplay">0</div>
    </div>
  </div>

  <!-- GRID -->
  <div class="panel-title">Merge Grid</div>
  <div class="grid" id="grid"></div>

  <!-- SHOP -->
  <div class="panel-title">Recruitment</div>
  <div class="actions-grid">
    <button class="btn btn-buy-1" id="btnBuy1" onclick="buyOrb(1)">
      <div class="btn-left">
        <span class="btn-main-text">Level 1 Unit</span>
        <span class="btn-sub-text">10 DMG / 50 HP</span>
      </div>
      <span class="btn-cost"><span id="cost1">10</span> 🪙</span>
    </button>
    
    <button class="btn btn-buy-2" id="btnBuy2" onclick="buyOrb(2)">
      <div class="btn-left">
        <span class="btn-main-text">Level 2 Unit</span>
        <span class="btn-sub-text">25 DMG / 125 HP</span>
      </div>
      <span class="btn-cost"><span id="cost2">250</span> 🪙</span>
    </button>
    
    <button class="btn btn-buy-3" id="btnBuy3" onclick="buyOrb(3)">
      <div class="btn-left">
        <span class="btn-main-text">Level 3 Unit</span>
        <span class="btn-sub-text">70 DMG / 350 HP</span>
      </div>
      <span class="btn-cost"><span id="cost3">2000</span> 🪙</span>
    </button>
  </div>
</div>

<script>
// ===== AUDIO SYSTEM =====
const AudioSys = {
  ctx: null,
  init: function() {
    if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(this.ctx.state === "suspended") this.ctx.resume();
  },
  play: function(freq, type, dur, vol=0.1) {
    if(!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + dur);
  },
  buy: () => AudioSys.play(600, 'square', 0.1, 0.1),
  merge: () => {
    AudioSys.play(800, 'sine', 0.1, 0.2);
    setTimeout(()=>AudioSys.play(1200, 'sine', 0.2, 0.1), 50);
  },
  hitEnemy: () => {
    AudioSys.play(150, 'sawtooth', 0.1, 0.15); // Crunchier hit
    setTimeout(()=>AudioSys.play(100, 'sawtooth', 0.15, 0.1), 50);
  },
  hitPlayer: () => {
    AudioSys.play(100, 'square', 0.2, 0.15); // Low impact
    setTimeout(()=>AudioSys.play(80, 'square', 0.2, 0.1), 50);
  },
  start: () => {
    AudioSys.play(300, 'square', 0.1, 0.1);
    setTimeout(()=>AudioSys.play(500, 'square', 0.4, 0.1), 150);
  },
  win: () => {
    AudioSys.play(500, 'sine', 0.1, 0.1);
    setTimeout(()=>AudioSys.play(700, 'sine', 0.1, 0.1), 100);
    setTimeout(()=>AudioSys.play(900, 'sine', 0.3, 0.1), 200);
  },
  lose: () => {
    AudioSys.play(150, 'sawtooth', 0.4, 0.2);
    setTimeout(()=>AudioSys.play(100, 'sawtooth', 0.4, 0.2), 300);
  },
  error: () => AudioSys.play(100, 'sawtooth', 0.3, 0.1),
  click: () => AudioSys.play(400, 'sine', 0.05, 0.1),
  bossTrigger: () => {
    AudioSys.play(100, 'sawtooth', 0.5, 0.3);
    setTimeout(()=>AudioSys.play(80, 'sawtooth', 0.5, 0.3), 400);
    setTimeout(()=>AudioSys.play(60, 'sawtooth', 1.0, 0.3), 800);
  }
};

// ===== GAME CONFIG =====
const CONFIG = {
  orbParams: {
    1: { baseCost: 10,   multiplier: 1.15 },
    2: { baseCost: 250,  multiplier: 1.30 }, 
    3: { baseCost: 2000, multiplier: 1.50 }  
  },
  basePlayerHP: 100,
  attackInterval: 1.0 // Seconds between attacks
};

// ORB STATS [Level]: { dps, hp }
const UNIT_STATS = {
  1: { dps: 10,   hp: 50 },
  2: { dps: 25,   hp: 125 },
  3: { dps: 70,   hp: 350 },
  4: { dps: 200,  hp: 900 },
  5: { dps: 600,  hp: 2500 },
  6: { dps: 2000, hp: 7000 },
  7: { dps: 8000, hp: 20000 },
  8: { dps: 50000,hp: 100000 },
  9: { dps: 250000, hp: 600000 } // God Unit
};

const ENEMIES = ["👾", "👹", "💀", "👻", "👽", "🤖", "🦇", "🐲"];

let state = {
  coins: 10, 
  grid: Array(16).fill(0),
  selectedIdx: null,
  purchases: { 1: 0, 2: 0, 3: 0 },
  
  // Battle State
  inBattle: false,
  stage: 1,
  wave: 1,
  
  isSecretBoss: false,
  
  // Timers for discrete attacks
  playerAttackTimer: 0,
  enemyAttackTimer: 0,
  
  // Auto Fight
  autoUnlocked: false,
  autoActive: false,
  
  enemyMaxHP: 50,
  enemyCurHP: 50,
  enemyDPS: 5,
  
  playerMaxHP: 100,
  playerCurHP: 100
};

// ===== DOM CACHE =====
const dom = {
  coins: document.getElementById('coinsDisplay'),
  dps: document.getElementById('dpsDisplay'),
  hp: document.getElementById('hpDisplay'),
  grid: document.getElementById('grid'),
  
  stageInfo: document.getElementById('stageInfo'),
  stage: document.getElementById('stageNum'),
  wave: document.getElementById('waveNum'),
  
  arena: document.getElementById('arena'),
  vsBadge: document.getElementById('vsBadge'),
  
  enemyVis: document.getElementById('enemyVisual'),
  playerVis: document.getElementById('playerVisual'),
  
  hpBarP: document.getElementById('hpBarPlayer'),
  hpCurP: document.getElementById('hpCurPlayer'),
  hpMaxP: document.getElementById('hpMaxPlayer'),
  
  hpBarE: document.getElementById('hpBarEnemy'),
  hpCurE: document.getElementById('hpCurEnemy'),
  hpMaxE: document.getElementById('hpMaxEnemy'),
  
  overlay: document.getElementById('overlay'),
  ovTitle: document.getElementById('overlayTitle'),
  ovSub: document.getElementById('overlaySub'),
  
  btnAuto: document.getElementById('btnAuto'),
  
  btn1: document.getElementById('btnBuy1'),
  btn2: document.getElementById('btnBuy2'),
  btn3: document.getElementById('btnBuy3'),
  cost1: document.getElementById('cost1'),
  cost2: document.getElementById('cost2'),
  cost3: document.getElementById('cost3')
};

// ===== CORE LOGIC =====

function init(){
  setupWaveStats(); 
  renderGrid();
  updateUI();
  updateBattleUI();
  loop();
}

function setupWaveStats() {
  if (state.isSecretBoss) return; // Don't reset if boss active

  // Enemy Scaling
  const baseHp = 50;
  const baseDps = 5;
  const power = ((state.stage - 1) * 5) + (state.wave - 1);
  
  state.enemyMaxHP = Math.floor(baseHp * Math.pow(1.35, power));
  state.enemyCurHP = state.enemyMaxHP;
  state.enemyDPS = Math.floor(baseDps * Math.pow(1.25, power));
  
  recalcPlayerStats();
  state.playerCurHP = state.playerMaxHP;
  
  // Reset Timers
  state.playerAttackTimer = 0;
  state.enemyAttackTimer = 0;
  
  const enemyIcon = ENEMIES[(state.stage - 1) % ENEMIES.length];
  dom.enemyVis.textContent = enemyIcon;
  
  // Clean UI
  dom.arena.classList.remove('boss-mode');
  dom.hpBarE.classList.remove('hp-boss');
  dom.hpBarE.classList.add('hp-enemy');
  dom.stageInfo.innerHTML = `Stage <span id="stageNum">${state.stage}</span> - Wave <span id="waveNum">${state.wave}</span>/5`;
  
  updateBattleUI();
}

function triggerSecretBoss() {
  state.inBattle = false; // Pause any current battle logic
  state.isSecretBoss = true;
  state.autoActive = false; // Turn off auto for this event
  
  // Flash effect
  const flash = document.createElement('div');
  flash.className = 'boss-flash';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 1500);
  
  AudioSys.init();
  AudioSys.bossTrigger();
  
  // BOSS STATS (Designed to be beatable by Lv9 but scary)
  // Lv9 Unit: 250k DMG / 600k HP
  // Boss needs to die in ~20 hits (20s) -> 5,000,000 HP
  // Boss needs to deal significant damage -> 20,000 DMG (30 hits to kill player)
  // Player wins with ~10s margin.
  
  state.enemyMaxHP = 5000000;
  state.enemyCurHP = state.enemyMaxHP;
  state.enemyDPS = 20000;
  
  // Heal Player for the fight
  recalcPlayerStats();
  state.playerCurHP = state.playerMaxHP;
  
  // Visuals
  dom.enemyVis.textContent = "☠️";
  dom.arena.classList.add('boss-mode');
  dom.hpBarE.classList.remove('hp-enemy');
  dom.hpBarE.classList.add('hp-boss');
  dom.stageInfo.textContent = "⚠️ SECRET BOSS CHALLENGE ⚠️";
  
  dom.overlay.style.display = 'none';
  
  // Start fight immediately
  state.inBattle = true;
  state.playerAttackTimer = 0.5;
  state.enemyAttackTimer = 0;
  
  updateBattleUI();
}

function startWave() {
  recalcPlayerStats(); 
  state.playerCurHP = state.playerMaxHP;
  
  state.playerAttackTimer = 0.5; 
  state.enemyAttackTimer = 0;
  
  AudioSys.init();
  AudioSys.start();
  state.inBattle = true;
  dom.overlay.style.display = 'none';
  updateBattleUI();
}

function toggleAuto() {
  AudioSys.init();
  AudioSys.click();
  state.autoActive = !state.autoActive;
  updateBattleUI();
}

function clickDamage(e) {
  if (!state.inBattle) return;
  AudioSys.init();
  
  const stats = calcTotalStats();
  const dmg = 2 + Math.floor(stats.dps * 0.05); // Small click damage
  
  damageEnemy(dmg, true); // true = isClick
}

function triggerPlayerAttack() {
    const stats = calcTotalStats();
    if(stats.dps <= 0) return;
    
    // VISUALS
    const orbs = document.querySelectorAll('.orb');
    if(orbs.length > 0) {
        for(let i=0; i<3; i++) {
            const rand = orbs[Math.floor(Math.random()*orbs.length)];
            rand.classList.remove('attacking');
            void rand.offsetWidth; // re-trigger
            rand.classList.add('attacking');
        }
    }
    
    dom.playerVis.classList.remove('attack-lunge-right');
    void dom.playerVis.offsetWidth;
    dom.playerVis.classList.add('attack-lunge-right');
    
    damageEnemy(stats.dps, false);
}

function damageEnemy(amount, isClick) {
  if (!state.inBattle) return;
  
  state.enemyCurHP -= amount;
  if(state.enemyCurHP <= 0) {
    state.enemyCurHP = 0;
    winWave();
  }
  
  dom.enemyVis.classList.remove('hit-flash');
  void dom.enemyVis.offsetWidth;
  dom.enemyVis.classList.add('hit-flash');
  
  if(!isClick) AudioSys.hitEnemy();
  
  spawnDmgNumber(dom.enemyVis, `-${Math.floor(amount)}`, '#fff');
  updateBattleUI();
}

function triggerEnemyAttack() {
    if(state.enemyDPS <= 0) return;

    dom.enemyVis.classList.remove('attack-lunge-left');
    void dom.enemyVis.offsetWidth;
    dom.enemyVis.classList.add('attack-lunge-left');
    
    damagePlayer(state.enemyDPS);
}

function damagePlayer(amount) {
  if (!state.inBattle) return;
  
  state.playerCurHP -= amount;
  if(state.playerCurHP <= 0) {
    state.playerCurHP = 0;
    loseWave();
  }
  
  dom.playerVis.classList.remove('hit-flash');
  void dom.playerVis.offsetWidth;
  dom.playerVis.classList.add('hit-flash');
  
  AudioSys.hitPlayer();
  
  spawnDmgNumber(dom.playerVis, `-${Math.floor(amount)}`, '#f87171');
  updateBattleUI();
}

function winWave() {
  state.inBattle = false;
  AudioSys.win();
  dom.enemyVis.classList.add('dead');
  
  // Rewards
  let reward = 0;
  if (state.isSecretBoss) {
      reward = 1000000; // 1 Million coins for killing boss
      spawnDmgNumber(dom.enemyVis, `👑 BOSS DEFEATED!`, '#facc15');
      setTimeout(() => spawnDmgNumber(dom.enemyVis, `+${reward.toLocaleString()} 🪙`, '#4ade80'), 600);
  } else {
      const baseReward = 15;
      const power = ((state.stage - 1) * 5) + (state.wave - 1);
      reward = Math.floor(baseReward * Math.pow(1.25, power));
      addCoins(reward);
      spawnDmgNumber(dom.enemyVis, `+${reward} 🪙`, '#4ade80');
  }
  
  setTimeout(() => {
    if (state.isSecretBoss) {
        state.isSecretBoss = false;
        addCoins(reward); // Give reward
        showOverlay("LEGENDARY VICTORY", "The Secret Boss has fallen.");
        // We stay on current stage/wave
        setupWaveStats();
        return;
    }

    state.wave++;
    if(state.wave > 5) {
      state.wave = 1;
      state.stage++;
    }

    if(state.stage >= 3) {
      state.autoUnlocked = true;
    }

    setupWaveStats();
    
    if(state.autoUnlocked && state.autoActive) {
       startWave();
    } else {
       showOverlay("VICTORY", "Wave Cleared! Prepare for next.");
    }
  }, 1600);
}

function loseWave() {
  state.inBattle = false;
  state.autoActive = false; 
  AudioSys.lose();
  dom.playerVis.classList.add('dead');
  
  updateBattleUI(); 
  
  setTimeout(() => {
    if (state.isSecretBoss) {
        state.isSecretBoss = false;
        showOverlay("CRUSHED", "The Secret Boss was too strong.");
        setupWaveStats(); // Return to normal
        return;
    }

    // Farm Mode Logic
    let pushedBack = false;
    
    if (state.wave > 1) {
      state.wave--;
      pushedBack = true;
    } else if (state.stage > 1) {
      state.stage--;
      state.wave = 5;
      pushedBack = true;
    }
    
    setupWaveStats(); 
    
    if(pushedBack) {
        showOverlay("DEFEAT", "Overwhelmed! Fell back to farm gold.");
    } else {
        showOverlay("DEFEAT", "Your army fell. Improve grid and try again.");
    }
  }, 1200);
}

function showOverlay(title, sub) {
  dom.ovTitle.textContent = title;
  dom.ovSub.textContent = sub;
  dom.overlay.style.display = 'flex';
}

// ... Market & Grid Logic ...
function getOrbCost(level) {
  const params = CONFIG.orbParams[level];
  const count = state.purchases[level];
  return Math.floor(params.baseCost * Math.pow(params.multiplier, count));
}

function buyOrb(level) {
  AudioSys.init();
  const cost = getOrbCost(level);
  
  if(state.coins < cost || state.grid.filter(v=>v===0).length === 0) {
    AudioSys.error();
    return;
  }
  
  state.coins -= cost;
  state.purchases[level]++;
  
  const empties = state.grid.map((v,i)=>v===0?i:-1).filter(i=>i!==-1);
  const idx = empties[Math.floor(Math.random() * empties.length)];
  state.grid[idx] = level; 
  
  AudioSys.buy();
  recalcPlayerStats();
  renderGrid();
  updateUI();
}

function handleCellClick(index) {
  if (state.inBattle && !state.isSecretBoss) return; // Prevent merging during normal battle
  // Allow merging during secret boss? No, let's keep it consistent.
  if (state.inBattle) return;
  
  AudioSys.init();
  const val = state.grid[index];
  
  if(val === 0) {
    state.selectedIdx = null;
    renderGrid();
    return;
  }
  
  if(state.selectedIdx === null) {
    state.selectedIdx = index;
    renderGrid();
  } else if(state.selectedIdx === index) {
    state.selectedIdx = null;
    renderGrid();
  } else {
    const targetVal = state.grid[state.selectedIdx];
    
    if(targetVal === val) {
      const newLvl = Math.min(val + 1, 9); // Allow up to 9
      state.grid[index] = newLvl;
      state.grid[state.selectedIdx] = 0;
      state.selectedIdx = null;
      
      AudioSys.merge();
      recalcPlayerStats();
      renderGrid();
      updateUI();
      
      // BOSS TRIGGER
      if(newLvl === 9) {
          triggerSecretBoss();
      }
      
    } else {
      state.selectedIdx = index;
      renderGrid();
    }
  }
}

function addCoins(amount) {
  state.coins += amount;
  updateUI();
}

function calcTotalStats() {
  let dps = 0;
  let hp = CONFIG.basePlayerHP;
  
  state.grid.forEach(lvl => {
    if(lvl > 0 && UNIT_STATS[lvl]) {
      dps += UNIT_STATS[lvl].dps;
      hp += UNIT_STATS[lvl].hp;
    }
  });
  return { dps, hp };
}

function recalcPlayerStats() {
  const s = calcTotalStats();
  state.playerMaxHP = s.hp;
  if(!state.inBattle) state.playerCurHP = state.playerMaxHP;
}

// ===== RENDER & UI =====
function updateBattleUI() {
  if(!state.isSecretBoss) {
     dom.stage.textContent = state.stage;
     dom.wave.textContent = state.wave;
  }
  
  // Auto Button
  if(state.autoUnlocked) {
    dom.btnAuto.style.display = 'block';
    if(state.autoActive) {
      dom.btnAuto.classList.add('active');
      dom.btnAuto.textContent = "AUTO: ON";
    } else {
      dom.btnAuto.classList.remove('active');
      dom.btnAuto.textContent = "AUTO: OFF";
    }
  } else {
    dom.btnAuto.style.display = 'none';
  }
  
  // Player Bar
  const pPct = Math.max(0, (state.playerCurHP / state.playerMaxHP) * 100);
  dom.hpBarP.style.width = pPct + '%';
  dom.hpCurP.textContent = Math.floor(state.playerCurHP).toLocaleString();
  dom.hpMaxP.textContent = Math.floor(state.playerMaxHP).toLocaleString();
  
  // Enemy Bar
  const ePct = Math.max(0, (state.enemyCurHP / state.enemyMaxHP) * 100);
  dom.hpBarE.style.width = ePct + '%';
  dom.hpCurE.textContent = Math.floor(state.enemyCurHP).toLocaleString();
  dom.hpMaxE.textContent = Math.floor(state.enemyMaxHP).toLocaleString();
}

function renderGrid() {
  dom.grid.innerHTML = '';
  state.grid.forEach((lvl, idx) => {
    const cell = document.createElement('div');
    cell.className = `cell ${state.selectedIdx === idx ? 'selected' : ''}`;
    cell.onclick = () => handleCellClick(idx);
    
    if(lvl > 0) {
      const orb = document.createElement('img');
      orb.className = `orb lvl${lvl}`;
      orb.src = `assets/level_${lvl}.jpg`;
      orb.alt = `Lv${lvl}`;
      
      orb.onerror = function() {
        if (this.src.endsWith('.jpg')) this.src = `assets/level_${lvl}.png`;
        else {
            this.style.display = 'none';
            const fb = document.createElement('div');
            fb.className = `orb-fallback lvl${lvl}`;
            cell.insertBefore(fb, cell.firstChild);
        }
      };

      const badge = document.createElement('div');
      badge.className = 'lvl-badge';
      badge.textContent = lvl;
      cell.appendChild(orb);
      cell.appendChild(badge);
    }
    dom.grid.appendChild(cell);
  });
}

function updateUI() {
  dom.coins.textContent = Math.floor(state.coins).toLocaleString();
  
  const stats = calcTotalStats();
  dom.dps.textContent = stats.dps.toLocaleString();
  dom.hp.textContent = stats.hp.toLocaleString();
  
  const isFull = !state.grid.includes(0);
  
  [1, 2, 3].forEach(lvl => {
    const cost = getOrbCost(lvl);
    const btn = dom['btn'+lvl];
    dom['cost'+lvl].textContent = cost.toLocaleString();
    
    const canAfford = state.coins >= cost;
    btn.disabled = isFull || !canAfford; 
    btn.style.opacity = (btn.disabled) ? 0.5 : 1;
  });
}

function spawnDmgNumber(element, text, color='#fff') {
  if(!element) return;
  const rect = element.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'dmg-num';
  f.textContent = text;
  f.style.color = color;
  f.style.left = (rect.left + rect.width/2) + 'px';
  f.style.top = (rect.top) + 'px'; 
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 600);
}

// ===== MAIN LOOP =====
let lastTime = performance.now();

function loop(time) {
  requestAnimationFrame(loop);
  
  const now = time || performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  if(!state.inBattle) return;

  if(dt > 0) {
    // Player Attacks (Tick based)
    state.playerAttackTimer += dt;
    if(state.playerAttackTimer >= CONFIG.attackInterval) {
        state.playerAttackTimer -= CONFIG.attackInterval;
        triggerPlayerAttack();
    }
    
    // Enemy Attacks (Tick based)
    state.enemyAttackTimer += dt;
    if(state.enemyAttackTimer >= CONFIG.attackInterval) {
        state.enemyAttackTimer -= CONFIG.attackInterval;
        triggerEnemyAttack();
    }
  }
}

init();

</script>
</body>
</html>
